name: Build Debug APK

# Builds an unsigned-by-you test APK (signed with the default Android debug key).
# Run it manually: Actions -> Build Debug APK -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Which APK to upload (armeabi-v7a = 32-bit phones, arm64-v8a, x86, x86_64, universal)'
        required: true
        default: 'armeabi-v7a'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # The runner image already ships the Android SDK; only accept its licenses.
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleGenericDebug

      - name: List APKs
        run: find app/build/outputs/apk -name '*.apk'

      # [SIMPLIFIED] previously uploaded every APK (~400 MB). Now only the chosen ABI (default
      # armeabi-v7a, ~60 MB) so the download is small on a slow connection.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seal-debug-${{ inputs.abi }}
          path: app/build/outputs/apk/generic/debug/*-${{ inputs.abi }}-debug.apk
          if-no-files-found: error
