name: Build APK

# Builds the small, optimized (minified) SnapKhalid APK.
# Run it manually: Actions -> Build APK -> Run workflow, then download the artifact.
#
# Signing: a signing key is generated on the first run and kept in the GitHub Actions cache, so
# later builds are signed with the same key and can be installed over the previous one.
# (If GitHub ever evicts the cache the key changes: uninstall the old app first, then install.)
on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Which CPU type: armeabi-v7a (32-bit phones), arm64-v8a, x86, x86_64, universal'
        required: true
        default: 'armeabi-v7a'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # The runner image already ships the Android SDK; only accept its licenses.
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Restore signing key
        id: key
        uses: actions/cache@v4
        with:
          path: signing/snapkhalid.jks
          key: snapkhalid-signing-key-v1

      - name: Create signing key (first run only)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p signing
          keytool -genkeypair -keystore signing/snapkhalid.jks -storetype JKS \
            -alias snapkhalid -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass snapkhalid-pass -keypass snapkhalid-pass -dname "CN=SnapKhalid"

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<PROPS
          keyAlias=snapkhalid
          keyPassword=snapkhalid-pass
          storeFile=${GITHUB_WORKSPACE}/signing/snapkhalid.jks
          storePassword=snapkhalid-pass
          PROPS

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (${{ inputs.abi }})
        run: |
          if [ "${{ inputs.abi }}" = "universal" ]; then ABIS="arm64-v8a;armeabi-v7a;x86;x86_64"; else ABIS="${{ inputs.abi }}"; fi
          ./gradlew assembleGenericRelease -PnoSplits "-PABI_FILTERS=$ABIS"

      - name: List APKs
        run: find app/build/outputs/apk -name '*.apk' -exec ls -l {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snapkhalid-${{ inputs.abi }}
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error
