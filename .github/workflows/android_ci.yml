name: Android CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # [CI-FIX] Disabled (commented out, not deleted): android-actions/setup-android@v3 currently
      # fails with "Failed to find package 'tools'" before the build even starts. The runner image
      # already ships the Android SDK, so we only need to accept its licenses.
      # - name: Setup Android SDK
      #   uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v3
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew buildGenericRelease
